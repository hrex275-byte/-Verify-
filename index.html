<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif;}
html, body{background:#ffffff;color:#000000;overflow-x:hidden;}
.hidden{display:none !important;}

/* === SCAN FACE SCREEN === */
.scan-screen{display:block;text-align:center;padding-top:100px;padding-bottom:60px;}
.scan-profile-pic{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid #e4e6eb;}
.scan-screen h2{font-size:32px;font-weight:bold;margin-bottom:12px;color:#000000;}
.scan-screen p{font-size:17px;color:#65676B;margin-bottom:36px;}
.scan-face-btn{background:#1877f2;color:#ffffff;border:none;padding:14px 40px;border-radius:6px;font-size:17px;font-weight:bold;cursor:pointer;}
.scan-face-btn:hover{background:#166fe5;}

/* === FACE SCANNING — BILOG NA LANG, WALANG IBA! === */
.face-scan-screen{text-align:center;padding-top:80px;}
.camera-circle{width:260px;height:260px;border-radius:50%;border:4px solid #1877f2;margin:0 auto;position:relative;overflow:hidden;}
.camera-circle video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.scan-line{position:absolute;width:100%;height:4px;background:#1877f2;animation:scan 2s infinite;left:0;}
@keyframes scan{0%{top:0;}50%{top:calc(100% - 4px);}100%{top:0;}}
.face-scan-screen h2{font-size:22px;margin-top:30px;margin-bottom:10px;color:#000000;}
.face-scan-screen p{color:#65676B;}

/* === LOADING SCREEN === */
.loading-screen{text-align:center;padding-top:150px;}
.spinner{width:50px;height:50px;border:4px solid #ddd;border-top-color:#1877f2;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-screen p{color:#65676B;font-size:16px;}

/* === PROFILE PAGE === */
.profile-page{display:block;max-width:600px;margin:0 auto;padding:20px 20px 40px 20px;background:#ffffff;overflow-y:auto;max-height:100vh;}
.cover-photo{width:100%;display:flex;align-items:center;justify-content:center;padding:10px 0 20px 0;}
.meta-logo-img{width:160px;height:auto;}

.profile-info{padding:0;background:#ffffff;}
.profile-pic{width:140px;height:140px;border-radius:50%;border:4px solid white;margin:0 auto 16px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,0.1);}
.profile-pic img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-size:32px;font-weight:bold;margin:0 0 12px 0;color:#000000;text-align:center;}

.profile-bio{font-size:15px;line-height:1.8;margin-bottom:20px;color:#000000 !important;text-align:center;}

/* === VOICE NOTE === */
.voice-note-container{display:flex;align-items:center;gap:10px;background:#f0f2f5;padding:8px 14px;border-radius:18px;margin:0 auto 24px;max-width:260px;cursor:pointer;transition:background 0.2s;}
.voice-note-container:hover{background:#e4e6eb;}
.voice-icon{color:#1877f2;font-size:18px;min-width:20px;text-align:center;}
.voice-text{font-size:14px;color:#050505;}
.voice-status{font-size:12px;color:#65676B;margin-left:auto;white-space:nowrap;}

.action-buttons{display:flex;gap:12px;margin-bottom:24px;}
.btn-dashboard{background:#1877f2;color:#ffffff;border:none;padding:10px 16px;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer;flex:1;}
.btn-create{background:#e4e6eb;color:#000000;border:none;padding:10px 16px;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer;flex:1;}

.tabs{display:flex;border-bottom:1px solid #ddd;margin-bottom:12px;}
.tab{padding:10px 16px;font-size:15px;font-weight:bold;cursor:pointer;color:#65676B;}
.tab.active{color:#1877f2;border-bottom:3px solid #1877f2;}

.personal-details{padding:0;background:#ffffff;}
.personal-details h3{font-size:17px;margin-bottom:16px;font-weight:bold;color:#000000;}
.detail-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-size:15px;color:#000000;}
.detail-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:#65676B;font-size:18px;flex-shrink:0;}
.detail-row span{color:#000000;line-height:1.5;}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
</head>
<body>

<script>

  profilePhotoLink:"https://i.imgur.com/igke2Wv.jpeg",

  voiceMessage: "Your Facebook Account is only temporary and you will need to contact Rex Hernandez to give you your Activation Link. You will also need to pay him so he can give it to you. Agent Rex Hernandez Agent of Meta Services Thank you",
  bioText: "looking for active players tmtplay online casino 50 minimum cashin message kana gawa kita account🎰🤗",
  homeTown: "113.19.141.43",
  currentCity: "Tondo Manila,Philippines",
  email: "angjeya4@gmail.com",
  work: "Digital Creator",
  gender: "Female",
  birthDate: "Nov 8, 1998"
};
</script>

<!-- === SCAN FACE SCREEN === -->
<div id="scanScreen" class="scan-screen">
  <img id="scanProfilePic" src="" alt="Profile" class="scan-profile-pic">
  <h2 id="scanName"></h2>
  <p>Tap to verify your identity</p>

</div>

<!-- === FACE SCANNING — BILOG NA LANG TALAGA! === -->

  <!-- WALANG IBANG VIDEO DITO — BILOG NA LANG! -->

  </div>

    <!-- Voice Note — Auto Play -->

      <i class="fa-solid fa-play voice-icon" id="voiceIcon"></i>

<script>
let isSpeaking = false;
let utterance = null;
let cameraStream = null;

// 📷 START CAMERA — SA LOOB LANG NG BILOG
async function startCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 320 } },
      audio: false 
    });
    document.getElementById('cameraFeed').srcObject = cameraStream;
  } catch (err) {
    console.log('Camera:', err.name);
  }
}

function stopCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
}

// 🔊 AUTO-PLAY VOICE
function tryPlayVoice() {
  if (!('speechSynthesis' in window) || isSpeaking) return;
  
  utterance = new SpeechSynthesisUtterance(CONFIG.voiceMessage);
  utterance.volume = 1;
  utterance.rate = 0.95;
  utterance.pitch = 1;
  
  utterance.onstart = function() {
    isSpeaking = true;
    document.getElementById('voiceIcon').className = 'fa-solid fa-volume-high voice-icon';
    document.getElementById('voiceStatus').textContent = 'Playing...';
  };
  
  utterance.onend = function() {
    isSpeaking = false;
    document.getElementById('voiceIcon').className = 'fa-solid fa-play voice-icon';
    document.getElementById('voiceStatus').textContent = 'Completed';
  };
  
  speechSynthesis.speak(utterance);
}

function toggleVoice() {
  if (!('speechSynthesis' in window)) {
    alert("Your browser doesn't support voice messages.");
    return;
  }

  if (isSpeaking) {
    speechSynthesis.cancel();
    isSpeaking = false;
    document.getElementById('voiceIcon').className = 'fa-solid fa-play voice-icon';
    document.getElementById('voiceStatus').textContent = 'Tap to play';
    return;
  }
  
  tryPlayVoice();
}

window.onload = function(){
  document.getElementById('scanProfilePic').src = CONFIG.profilePhotoLink;
  document.getElementById('scanName').textContent = CONFIG.fullName;
  document.getElementById('profileImg').src = CONFIG.profilePhotoLink;
  document.getElementById('profileName').textContent = CONFIG.fullName;
  document.getElementById('profileBio').innerHTML = CONFIG.bioText;
  document.getElementById('detailWork').textContent = CONFIG.work;
  document.getElementById('detailSchool').textContent = CONFIG.school;
  document.getElementById('detailHome').textContent = `From ${CONFIG.homeTown}`;
  document.getElementById('detailCity').textContent = `Lives in ${CONFIG.currentCity}`;
  document.getElementById('detailStatus').textContent = CONFIG.relationshipStatus;
  document.getElementById('detailBirthDate').textContent = CONFIG.birthDate;
  
  // Scan Face button
  document.getElementById('scanFaceBtn').addEventListener('click', function() {
    document.getElementById('scanScreen').classList.add('hidden');
    document.getElementById('faceScanScreen').classList.remove('hidden');
    
    startCamera(); // 📷 Bubukas — BILOG LANG!
    
    setTimeout(function() {
      document.getElementById('faceScanScreen').classList.add('hidden');
      document.getElementById('loadingScreen').classList.remove('hidden');
    }, 2500);
    
    setTimeout(function() {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('profilePage').classList.remove('hidden');
      stopCamera();
      
      // 🔊 Auto-play voice
      setTimeout(() => {
        tryPlayVoice();
      }, 600);
    }, 4000);
  });
};
</script>
